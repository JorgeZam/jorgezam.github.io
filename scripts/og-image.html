<!doctype html>
<!--
  Source of images/og-image.jpg, the square image shown when the site is shared.
  To regenerate after changing the text, run from the repository root:
    "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,1200 --virtual-time-budget=8000 \
      --screenshot=og-image.png "file://$PWD/scripts/og-image.html"
    sips -s format jpeg -s formatOptions 90 og-image.png --out images/og-image.jpg && rm og-image.png
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 1200px; overflow: hidden; }
  body {
    font-family: "Chivo", sans-serif;
    color: rgba(255, 255, 255, 0.86);
    background:
      radial-gradient(ellipse at 85% 0%, rgba(111, 211, 223, 0.16), transparent 55%),
      linear-gradient(135deg, #050f2b 0%, #0b1d3a 55%, #16325e 100%);
    box-sizing: border-box;
    padding: 96px 110px 92px;
    display: flex;
    flex-direction: column;
  }
  .content { margin: auto 0; }
  .avatar {
    display: block;
    width: 320px; height: 320px; border-radius: 50%; object-fit: cover;
    border: 9px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
  }
  .kicker {
    margin: 60px 0 20px; color: #6fd3df; font-size: 34px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  h1 {
    margin: 0; color: #fff; font-size: 110px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
  }
  .affiliation { margin: 34px 0 0; font-size: 46px; font-weight: 500; }
  .bio { margin: 18px 0 0; color: rgba(255, 255, 255, 0.62); font-size: 36px; line-height: 1.4; }
  .footer {
    padding-top: 34px; border-top: 2px solid rgba(255, 255, 255, 0.14);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 30px; font-weight: 500;
  }
  .footer .url { color: #6fd3df; }
  .footer .bar { width: 64px; height: 6px; border-radius: 3px; background: #6fd3df; }
</style>
</head>
<body>
  <div class="content">
    <img class="avatar" src="../images/profile.jpg" alt="">
    <p class="kicker">Assistant Professor</p>
    <h1>Jorge E. Zambrano<br>Ibujés</h1>
    <p class="affiliation">Universidad Diego Portales · Santiago, Chile</p>
    <p class="bio">Ph.D. in Electrical Engineering, Universidad de Chile</p>
  </div>
  <div class="footer"><span class="url">jorgezam.github.io</span><span class="bar"></span></div>
</body>
</html>
