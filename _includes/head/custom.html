{% include base_path %}
{% include hero_layout %}

<!-- start custom head snippets -->
{% if hero_layout %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{% if site.site_theme == "owcis" %}
<link rel="preload" href="{{ base_path }}/assets/fonts/cmu-serif/cmu-serif-500-roman.woff2" as="font" type="font/woff2" crossorigin>
{% endif %}
{% if site.site_theme == "swiss" %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
{% else %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
{% endif %}
{% endif %}
<meta name="google-site-verification" content="sLgvNQ81f3_64QEvRvAuAB4XAR7Pdzh2YwL19vnz2FM" />
<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/android-chrome-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="{% if site.site_theme == "owcis" %}#050f2b{% else %}#ffffff{% endif %}"/>

<!-- end custom head snippets -->
